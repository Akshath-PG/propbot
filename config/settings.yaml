# ---------------------------------------------------------------
# PropBot main settings
# ---------------------------------------------------------------

# Which firm rule file to load (see config/firms/) and which phase.
firm_file: config/firms/example_firm.yaml
phase: evaluation            # evaluation | funded
initial_balance: 100000      # account size in account currency (USD)

# Instruments. Names must match your broker's MT5 symbol names exactly
# (some brokers use XAUUSD.r, EURUSDm, NAS100, USTEC ...).
symbols:
  XAUUSD: {contract_size: 100,    point: 0.01,    lot_step: 0.01, min_lot: 0.01, max_lot: 50, pnl_conversion: quote_usd, currencies: [USD, XAU], commission_per_lot: 7.0}
  EURUSD: {contract_size: 100000, point: 0.00001, lot_step: 0.01, min_lot: 0.01, max_lot: 50, pnl_conversion: quote_usd, currencies: [EUR, USD], commission_per_lot: 7.0}
  GBPUSD: {contract_size: 100000, point: 0.00001, lot_step: 0.01, min_lot: 0.01, max_lot: 50, pnl_conversion: quote_usd, currencies: [GBP, USD], commission_per_lot: 7.0}
  USDJPY: {contract_size: 100000, point: 0.001,   lot_step: 0.01, min_lot: 0.01, max_lot: 50, pnl_conversion: base_usd,  currencies: [USD, JPY], commission_per_lot: 7.0}
  US100:  {contract_size: 1,      point: 0.01,    lot_step: 0.1,  min_lot: 0.1,  max_lot: 100, pnl_conversion: quote_usd, currencies: [USD],     commission_per_lot: 0.0}

timeframe: M15               # entry timeframe
higher_timeframes: [H1, H4]  # used for trend / structure context

# MT5 server time is usually UTC+2 (winter) / UTC+3 (summer).
# Used only to place session/killzone features correctly.
server_utc_offset_hours: 2

# ---------------------------------------------------------------
# Data split  (time-ordered, never shuffled)
# ---------------------------------------------------------------
history_start: "2018-01-01"
train_end:     "2025-12-31"  # model never sees anything after this during training
test_start:    "2026-01-01"  # true out-of-sample "real data" test
test_end:      null          # null = up to latest available bar

data_dir: data
model_dir: models
report_dir: reports

# ---------------------------------------------------------------
# Labeling: what counts as a winning trade (triple-barrier)
# ---------------------------------------------------------------
labels:
  atr_period: 14
  sl_atr: 1.5        # stop loss = 1.5 x ATR
  tp_atr: 3.0        # take profit = 3.0 x ATR  (1:2 reward/risk)
  horizon_bars: 32   # trade must resolve within 32 bars (8h on M15), else closed at market

# ---------------------------------------------------------------
# Training / anti-overfitting
# ---------------------------------------------------------------
training:
  cv_splits: 6               # walk-forward folds inside the training period
  embargo_bars: 64           # gap after each validation fold (prevents leakage)
  expert_params:             # gradient-boosting experts, kept deliberately small
    max_depth: 3
    learning_rate: 0.05
    max_iter: 200
    min_samples_leaf: 600
    l2_regularization: 3.0
  meta_C: 0.5                # regularization of the combiner (smaller = simpler)
  overfit_gap_warn: 0.04     # warn if train vs validation log-loss gap exceeds this
  # Confidence = probability the trade reaches TP (2R) before SL (1R).
  # Break-even for a 1:2 trade is ~34% + costs, so 0.40-0.50 is already a strong edge.
  threshold_grid: [0.30, 0.80, 0.01]
  min_trades_per_month: 8    # a threshold that gives fewer trades than this is rejected
  min_expectancy_r: 0.05     # minimum average R per trade to call the model tradeable

# ---------------------------------------------------------------
# Execution and session safety (applies on top of the firm rules)
# ---------------------------------------------------------------
trading:
  risk_per_trade_pct: 0.5    # % of current equity risked per trade at SL
  max_open_trades: 2
  max_trades_per_day: 6
  one_position_per_symbol: true

session_guard:
  max_consecutive_losses: 3  # stop for the day after this many losses in a row
  daily_soft_loss_pct: 2.0   # stop for the day at -2% (well before the firm's daily limit)
  threshold_raise: 0.08      # next day, require confidence = base threshold + this
  reset_after_win: true      # raised threshold drops back after a winning trade

live:
  dry_run: true              # true = log signals only, no orders. Set false only after demo testing.
  magic_number: 260101
  poll_seconds: 5
  calendar_file: data/calendar.csv   # refreshed by the MQL5 ExportCalendar script
  log_file: reports/live_log.csv
